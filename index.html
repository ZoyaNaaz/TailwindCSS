<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>
    <link rel="stylesheet" href="./src/output.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body class="">
    <!-- Navbar -->
    <nav class="p-3 bg-white flex items-center justify-between relative z-50 shadow-md">
        <a class="flex gap-2 items-center" href="#">
            <img class="rounded-full" src="./assets/asset 0.png" alt="Logo">
            <span class="font-display font-medium text-lg">ToDesktop</span>
        </a>
        <div class="lg:flex gap-10 text-sm hidden" id="nav-items">
            <a class="font-display font-medium hover:text-primary" href="#">Pricing</a>
            <a class="font-display font-medium hover:text-primary" href="#">Docs</a>
            <a class="font-display font-medium hover:text-primary" href="#">Changelog</a>
            <a class="font-display font-medium hover:text-primary" href="#">Blog</a>
            <a class="font-display font-medium hover:text-primary" href="#">Login</a>
        </div>
        <button class="hidden lg:block border border-gray-300 rounded px-4 py-2">
            <!-- <img src="" alt=""> -->
            <i class="fa-solid fa-plane text-gray-500"></i>
            <span>Electron Developer</span>
            <i class="fa-solid fa-arrow-right text-gray-500"></i>
        </button>
        <button class="lg:hidden" onclick="handleMenu()"><i class="fa-solid fa-bars text-gray-500"></i></button>
        <!-- nav dialog -->
        <div class="hidden w-full h-full bg-white fixed inset-0 z-10 " id="nav-dialog">
            <div id="upper-nav-dialog" class="flex justify-between items-center p-3 shadow">
                <a class="flex gap-2 items-center" href="#">
                    <img class="rounded-full" src="./assets/asset 0.png" alt="Logo">
                    <span class="font-display font-medium text-lg">ToDesktop</span>
                </a>
                <i class="fa-solid fa-xmark" onclick="handleMenu()"></i>
            </div>
            <div id="middle-nav-dialog" class="flex flex-col p-4">
                <a class="font-display px-4 py-2 rounded-lg hover:bg-slate-50" href="#">Pricing</a>
                <a class="font-display px-4 py-2 rounded-lg hover:bg-slate-50" href="#">Docs</a>
                <a class="font-display px-4 py-2 rounded-lg hover:bg-slate-50" href="#">Changelog</a>
                <a class="font-display px-4 py-2 rounded-lg hover:bg-slate-50" href="#">Blog</a>
                <a class="font-display px-4 py-2 rounded-lg hover:bg-slate-50" href="#">Login</a>
            </div>
            <div class="h-[1px] ml-4 bg-gray-200"></div>
            <button class="w-full rounded mt-4 px-4 py-2 text-left hover:bg-slate-50 ">
                <!-- <img src="" alt=""> -->
                <i class="fa-solid fa-plane text-gray-500"></i>
                <span class="text-left">Electron Developer</span>
                <i class="fa-solid fa-arrow-right text-gray-500"></i>
            </button>

        </div>
    </nav>
    <!-- Main -->
    <main>
        <!-- hero section -->
        <section id="hero-section" class="min-h-screen bg-gradient-to-br from-purple-50 via-orange-50 to-transparent">
            <div
                class="max-w-4xl mx-auto flex flex-col sm:items-center sm:justify-center sm:text-center sm:pt-12 sm:max-w-2xl p-6">
                <button id="version"
                    class="mt-4 w-fit flex items-center gap-2 font-body bg-yellow-50 border border-yellow-300 px-4 py-1 rounded-md text-sm shadow-lg hover:-translate-y-1 transition duration-300 group md:px-5 md:py-2">
                    <div id="circle" class="h-2 w-2 rounded-full bg-yellow-400 border border-yellow-600"></div>
                    <p class="text-yellow-600 text-md font-medium text-left">v0.21.1: <span
                            class="text-yellow-800">Find-in-page bug fixes</span></p>
                    <i class="fa-solid fa-arrow-right text-yellow-600 group-hover:translate-x-1 transition"></i>
                </button>
                <!-- code section for medium and above -->
                <div class="hidden gap-6 mt-12 md:flex">
                    <div class="flex gap-1 items-center">
                        <i class="fa-solid fa-code text-gray-500"></i>
                        <p class="text-gray-500 font-body">Code Optional</p>
                    </div>
                    <div class="flex gap-1 items-center">
                        <i class="fa-solid fa-hand-back-fist text-gray-500"></i>
                        <p class="text-gray-500 font-body">Drag & drop builder</p>

                    </div>
                    <div class="flex gap-1 items-center">
                        <i class="fa-solid fa-laptop text-gray-500"></i>
                        <p class="text-gray-500 font-body">Windows, Mac, Linux</p>

                    </div>
                </div>
                <div class="mt-12">
                    <h1 class="font-semibold text-4xl md:text-6xl">Web app to desktop app in minutes</h1>
                    <p class="mt-6 font-body text-xl text-gray-800 md:text-2xl">Take your web app codebase and transform
                        it into a cross platform desktop app with native functionality.</p>
                </div>
                <div class="mt-8 flex flex-col gap-4 sm:flex-row">
                    <button
                        class="font-body font-medium bg-[#464CF2] text-white text-sm rounded-md px-4 py-3 hover:bg-blue-600 transition duration-300">Download
                        Now</button>
                    <button
                        class="font-body font-medium border border-gray-400 text-sm rounded-md px-4 py-3 hover:border-gray-600 transition duration-300">Read
                        Docs</button>
                </div>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>

</html>
